<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="tcm" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>عادت‌ها</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="عادت‌ها">
<style>
:root{--sheet:#11151b;--line:rgba(255,255,255,.07);--track:rgba(255,255,255,.16);--navbg:rgba(22,27,34,.9);--rowtx:#fff;--cell:rgba(255,255,255,.07);--page:radial-gradient(120% 60% at 50% -10%,#14212a 0%,#000 60%),#000;--yr:255,210,63;--tr:31,209,193;--bg:#000;--s1:#0d1015;--s2:#161b22;--s3:#222a35;--tx:#f5f5f6;--mu:#8a94a3;--y:#ffd23f;--t:#1fd1c1;--g:#a9b4c8;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);background-attachment:fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;direction:rtl;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s2);border:1.5px solid var(--s3);border-radius:14px;padding:12px 14px;width:100%;outline:none;direction:rtl}
input:focus,textarea:focus,select:focus{border-color:var(--y)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:calc(14px + var(--sa)) 16px calc(150px + var(--sb))}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd .ttl{flex:1;text-align:center}
.hd h1{font-size:22px;font-weight:800}
.hd small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.pill{background:linear-gradient(135deg,var(--y),var(--t));color:#07100f;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.tdbtn{width:40px;height:40px;border-radius:50%;background:var(--y);color:#111;font-weight:800;font-size:15px;display:grid;place-items:center;flex:none}

/* week */
.wk{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:6px}
.wk button{width:32px;height:28px;font-size:20px;color:var(--g);border-radius:10px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;touch-action:pan-y}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 0 8px;border-radius:26px;border:1.5px solid transparent;color:var(--mu);font-size:12px}
.wd.sel{border-color:rgba(var(--yr),.55);background:rgba(var(--yr),.06);color:var(--tx)}
.wd.today .wl{color:var(--y);font-weight:800}
.wd.fut{opacity:.55}
.rg{position:relative;width:38px;height:38px;display:block}
.rg svg{width:100%;height:100%;display:block}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tx)}
.rt{fill:none;stroke:var(--track);stroke-width:2.6}
.rp{fill:none;stroke:var(--t);stroke-width:3.2;stroke-linecap:round;transition:stroke-dasharray .5s}
.rg.z .rp{display:none}
.rg.full .rp{stroke:var(--y)}
.rg.full .rt{stroke:rgba(var(--yr),.25)}
.rg.none .rt{stroke-dasharray:2 3.4;stroke:var(--track)}

/* summary */
.sum{margin:14px 2px 14px}
.sum .l{display:flex;justify-content:space-between;font-size:13px;color:var(--g);margin-bottom:7px}
.sum .l b{color:var(--tx)}
.bar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--t),#7ee8d2 55%,var(--y));transition:width .5s}

/* habit rows */
.row{position:relative;height:68px;border-radius:20px;overflow:hidden;margin-bottom:11px;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .15s}
.row.dg .fill{transition:none}
.row.dg{transform:scale(1.015)}
.row.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.025)}}
.row .fill{position:absolute;top:0;bottom:0;right:0;overflow:hidden;background:var(--c);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.rc{display:flex;align-items:center;gap:12px;height:68px;padding:0 16px;color:var(--rowtx);white-space:nowrap}
.rc.dk{position:absolute;right:0;top:0;width:100cqw;color:#0a0a0a;pointer-events:none}
.rc.lt{position:relative}
.ri{font-size:26px;line-height:1;flex:none}
.rn{flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:13px;font-weight:600;flex:none}
.mb{width:26px;text-align:center;font-weight:800;font-size:18px;opacity:.7;font-style:normal;flex:none}
.row.done{box-shadow:0 0 0 1.5px var(--c),0 0 22px -4px var(--c)}
.big .row{height:76px}.big .rc{height:76px}
.empty{text-align:center;color:var(--mu);padding:46px 10px;line-height:2}
.empty .em{font-size:44px;display:block;margin-bottom:6px}
.btn{display:inline-block;background:var(--y);color:#111;font-weight:800;padding:12px 22px;border-radius:16px}
.btn.t{background:var(--t)}
.btn.g{background:var(--s3);color:var(--tx)}
.btn.r{background:rgba(255,90,82,.14);color:#ff6b63}
.btn.blk{display:block;width:100%;text-align:center;padding:15px}

.tb{display:flex;align-items:center;gap:10px;background:rgba(var(--tr),.12);border:1.5px solid rgba(var(--tr),.5);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.tb span{flex:1}.tb b{color:var(--t)}
.tb button{background:var(--t);color:#04100f;font-weight:800;border-radius:12px;padding:6px 12px;font-size:13px}

/* fab + nav */
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(92px + var(--sb));width:58px;height:58px;border-radius:50%;background:var(--y);color:#111;font-size:32px;font-weight:300;display:none;place-items:center;box-shadow:0 8px 26px rgba(var(--yr),.35);z-index:20}
.fab.on{display:grid}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));width:min(92%,440px);display:flex;gap:2px;padding:7px;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:24px;color:var(--mu);font-size:10.5px;transition:background .2s,color .2s}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--s3);color:var(--y)}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:46px;height:46px;border-radius:16px;background:var(--s2);display:grid;place-items:center;font-size:22px;border:1.5px solid transparent;padding:0 12px}
.chip.on{border-color:var(--y);background:rgba(var(--yr),.1)}
.chip.txt{font-size:14px;font-weight:800}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-size:16px}
.mnav button{width:38px;height:34px;font-size:22px;color:var(--g);border-radius:12px;background:var(--s2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;justify-items:center}
.cal .h{font-size:12px;color:var(--mu);font-weight:700}
.cd{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:50%}
.cd.fut{opacity:.4}
.cd.sel .rg{filter:drop-shadow(0 0 4px rgba(var(--yr),.6))}
.cd i{width:5px;height:5px;border-radius:50%;background:var(--y);margin-top:-4px}
.rate{display:flex;flex-direction:column;align-items:center;gap:14px}
.rate .rg{width:168px;height:168px}
.rate .rg .rp{stroke-width:2.8}
.rate .rg .rt{stroke-width:2.8}
.rate .rg b{flex-direction:column;font-size:34px;font-weight:800;gap:2px;display:flex;align-items:center;justify-content:center}
.rate .rg b small{font-size:12px;font-weight:600;color:var(--g)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--s2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat .ic{font-size:20px}
.stat b{font-size:24px;font-weight:800}
.stat b small{font-size:12px;color:var(--mu);font-weight:600;margin-right:4px}
.stat span{font-size:12px;color:var(--mu)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11px;color:var(--mu)}
.bars i{width:100%;max-width:26px;border-radius:9px 9px 5px 5px;background:var(--t);min-height:4px}
.bars i.f{background:var(--y)}
.bars i.z{background:var(--s3)}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hb:last-child{margin-bottom:0}
.hb .e{font-size:22px;width:30px;text-align:center}
.hb .m{flex:1}
.hb .m div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.hb .m i{display:block;height:100%;border-radius:9px}
.hb .m .bar{height:7px}

/* habit list page */
.hl{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:10px}
.hl .e{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.hl .m{flex:1;min-width:0}
.hl .m b{display:block;font-size:15px}
.hl .m span{font-size:12px;color:var(--mu)}
.hl .mv{display:flex;flex-direction:column;gap:2px}
.hl .mv button{width:30px;height:24px;color:var(--g);font-size:13px;background:var(--s2);border-radius:8px}

/* notes */
.moods{display:flex;justify-content:space-between;margin:4px 0 14px}
.moods button{width:54px;height:54px;border-radius:18px;background:var(--s2);font-size:28px;border:1.5px solid transparent;filter:grayscale(.7);opacity:.7}
.moods button.on{border-color:var(--t);filter:none;opacity:1;background:rgba(var(--tr),.1)}
textarea{min-height:150px;resize:vertical;line-height:1.9}
.nt{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:right;width:100%}
.nt:first-of-type{border-top:0}
.nt .e{font-size:24px}
.nt div{flex:1;min-width:0}
.nt b{font-size:13px;display:block}
.nt span{font-size:12px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* settings */
.sw{width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--t)}
.sw.on::after{transform:translateX(-20px)}
.ver{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}

/* sheet */
#bg{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#bg.on{display:flex}
#sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--sheet);border-radius:30px 30px 0 0;padding:10px 18px calc(26px + var(--sb));animation:up .26s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .e{font-size:34px}
.sh b{font-size:18px;display:block}
.sh span{font-size:12px;color:var(--mu)}
.qs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.qs button{flex:1 1 30%;padding:13px 0;border-radius:16px;background:var(--s2);font-weight:800;font-size:15px;border:1.5px solid var(--s3)}
.qs button.p{border-color:rgba(var(--tr),.5);color:var(--t)}
.qs button.m{color:#ff7a73}
.qs button:active{transform:scale(.96)}
.cus{display:flex;gap:8px;margin-bottom:12px}
.cus input{flex:1.3;text-align:center}
.cus button{flex:1;border-radius:14px;font-weight:800;padding:0 6px}
.two{display:flex;gap:10px;margin-top:6px}
.two>*{flex:1}
.tm{text-align:center;font-size:36px;font-weight:800;color:var(--t);margin:10px 0;letter-spacing:1px}
.lbl{font-size:13px;color:var(--g);margin:16px 0 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:12px;background:var(--s2);font-size:20px;border:1.5px solid transparent}
.grid button.on{border-color:var(--y);background:rgba(var(--yr),.1)}
.grid.c button{border-radius:50%;border:3px solid var(--sheet)}
.grid.c button.on{box-shadow:0 0 0 2px #fff}
.seg{display:flex;background:var(--s2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 4px;border-radius:12px;font-size:13px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--y);color:#111}
.dys{display:flex;gap:6px}
.dys button{flex:1;aspect-ratio:1;max-width:48px;border-radius:50%;background:var(--s2);font-weight:800;color:var(--mu);border:1.5px solid transparent}
.dys button.on{background:rgba(var(--tr),.15);border-color:var(--t);color:var(--t)}
.rw{display:flex;gap:8px}
.rw>*{flex:1}
.rw select{flex:.8}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,20px);background:#2c2c30;color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
input[type=time]{text-align:center}
.fz{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(91,192,255,.1);border:1.5px dashed rgba(91,192,255,.45);border-radius:16px;padding:9px 12px;margin:16px 0 12px;font-size:12.5px;color:#a9dcff;line-height:1.7}
.fz.on{background:rgba(91,192,255,.18);border-style:solid}
.fz button{background:#5bc0ff;color:#06131c;font-weight:800;border-radius:11px;padding:6px 14px;font-size:13px;flex:none}
.tb.nd{background:rgba(var(--yr),.1);border-color:rgba(var(--yr),.5)}
.wsum{display:flex;align-items:baseline;gap:12px}.wsum b{font-size:34px;font-weight:800}.wsum .up{color:var(--t)}.wsum .dn{color:#ff8a80}
.wnote{font-size:13px;color:var(--g);line-height:2.1;margin-top:8px}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg div{background:var(--s2);border-radius:18px;padding:12px 6px;text-align:center;opacity:.42;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;border:1px solid rgba(var(--yr),.45);background:rgba(var(--yr),.07)}
.bdg span{font-size:28px;display:block}.bdg b{font-size:12px;display:block;margin-top:4px}.bdg small{font-size:10.5px;color:var(--mu);display:block;margin-top:2px;line-height:1.5}
.ths{display:flex;gap:10px}.ths button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:18px;background:var(--s2);border:1.5px solid transparent;font-size:12px;font-weight:700}
.ths button i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
.ths button.on{border-color:var(--y)}
#cel{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:90;padding:24px}
#cel.on{display:flex}
.cc{background:var(--sheet);border:1px solid rgba(var(--yr),.4);border-radius:30px;padding:28px 22px;text-align:center;max-width:340px;box-shadow:0 0 60px -10px rgba(var(--yr),.5);animation:up .4s}
.cc .cem{font-size:56px;display:block}.cc h2{font-size:20px;margin:10px 0;line-height:1.6}.cc p{color:var(--g);line-height:2;margin-bottom:18px;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#conf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
#foc{position:fixed;inset:0;background:radial-gradient(90% 60% at 50% 20%,#12303a 0%,#05070a 70%);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
#foc.on{display:flex}
#foc .fe{font-size:54px}#foc .fn{font-size:22px}
#foc .rg{width:250px;height:250px}#foc .rg b{font-size:42px;letter-spacing:1px}
#fsv{display:block;width:100%;height:100%}
#foc .fh{color:var(--g);font-size:14px;margin-bottom:10px;text-align:center}
html[data-mode=light]{--bg:#f2f4f8;--s1:#ffffff;--s2:#eef1f6;--s3:#dfe5ee;--tx:#10151c;--mu:#6b7686;--g:#4a5565;--sheet:#ffffff;--line:rgba(16,21,28,.09);--track:rgba(16,21,28,.12);--navbg:rgba(255,255,255,.93);--rowtx:#10151c;--page:#f2f4f8;--cell:rgba(16,21,28,.08)}
html[data-mode=light] .nav button.on{background:var(--y);color:#111}
html[data-mode=light] .wd.today .wl{color:var(--tx);text-decoration:underline}
html[data-mode=light] .sw::after{box-shadow:0 1px 3px rgba(0,0,0,.3)}
html[data-mode=light] .rc.dk{color:#0a0a0a}
html[data-mode=light] .row{box-shadow:0 1px 0 rgba(16,21,28,.05)}
.card h3.hrow{display:flex;align-items:center;justify-content:space-between}
.mini{background:var(--s3);color:var(--tx);font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:12px}
.sk{font-style:normal;font-size:12px;font-weight:800;opacity:.9;margin-right:4px}
.ch{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:right}
.ch:first-of-type{border-top:0}
.ch .e{font-size:26px;width:34px;text-align:center}
.ch .m{flex:1;min-width:0}.ch .m>div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
.ch .m .bar{height:7px}
.cu{display:block;width:100%;background:var(--s2);color:var(--g);font-size:13px;font-weight:700;padding:13px;border-radius:16px;margin-top:6px}
.cuw{display:flex;flex-wrap:wrap;gap:8px}
.cuw button{padding:9px 14px;border-radius:14px;background:var(--s2);border:1.5px solid var(--c);font-size:13px;font-weight:700}
.stl{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.stp{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--s2);border:1.5px solid transparent;text-align:right;font-size:15px;font-weight:600}
.stp .bx{width:26px;height:26px;border-radius:9px;border:2px solid var(--mu);display:grid;place-items:center;font-size:15px;color:#111;flex:none}
.stp.on{border-color:var(--t);background:rgba(var(--tr),.1)}
.stp.on .bx{background:var(--t);border-color:var(--t)}
.hm{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hm::-webkit-scrollbar{display:none}
.hcol{display:flex;flex-direction:column;gap:4px;flex:none}
.hl2{height:14px;font-size:10px;color:var(--mu);white-space:nowrap;line-height:14px}
.hc{width:15px;height:15px;border-radius:4px;background:var(--cell);display:block;padding:0;border:0;flex:none}
.hc.hx{visibility:hidden}

.gt{font-size:13px;color:var(--mu);font-weight:700;margin:22px 8px 8px}

.rw2 .tx{flex:1;min-width:0}.rw2 .tx b{display:block;font-size:15px;font-weight:700}.rw2 .tx small{display:block;color:var(--mu);font-size:12px;margin-top:2px;line-height:1.7}

.lkm{font-style:normal;font-size:11px;opacity:.75;margin-right:3px}
.cnb{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:linear-gradient(135deg,rgba(var(--yr),.13),rgba(var(--tr),.1));border:1px solid rgba(var(--yr),.3);border-radius:18px;padding:11px 14px;margin-bottom:12px}
.cnb .ci{font-size:24px;flex:none}.cnb .cm{flex:1;min-width:0}.cnb .cl{font-size:13px;line-height:1.9;color:var(--tx)}.cnb .cl.neg{color:#ff8a80}.cnb .ar{color:var(--mu);font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"><main id="v"></main></div>
<button class="fab" id="fab" aria-label="عادت جدید">+</button>
<nav class="nav" id="nav"></nav>
<div id="bg"><div id="sheet"><div class="grab"></div><div id="sb"></div></div></div>
<div id="toast"></div>
<div id="foc"></div>
<div id="cel"><div id="conf"></div><div class="cc"><span class="cem">🏆</span><h2 id="celh">همه‌ی عادت‌های امروز کامل شد!</h2><p id="celq"></p><button class="btn" data-celx="1">ادامه</button></div></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const wd=s=>(fromIso(s).getDay()+1)%7; // Saturday = 0
const todayIso=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[٬,،\s]/g,'');
const num=s=>{const v=parseFloat(toEn(s));return isFinite(v)?v:NaN};
const nf=v=>(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'};

/* ---------- Jalali ---------- */
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const gy2=gm>2?gy+1:gy;let days=365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}const jm=days<186?1+~~(days/31):7+~~((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy=jy>979?1600:621;jy-=jy>979?979:0;let days=365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){const v=sa[gm];if(gd<=v)break;gd-=v}return[gy,gm,gd]}
const jp=s=>{const d=fromIso(s);return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fromJ=(y,m,d)=>{const g=j2g(y,m,d);return g[0]+'-'+pad(g[1])+'-'+pad(g[2])};
const jmLen=(y,m)=>m<7?31:m<12?30:(g2j.apply(null,j2g(y,12,30))[1]===12?30:29);
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const WS=['ش','ی','د','س','چ','پ','ج'];
const jl=s=>{const j=jp(s);return j[2]+' '+JM[j[1]-1]};

/* ---------- data ---------- */
const KEY='habit-tracker-v1';
const COLORS=['#ffd23f','#1fd1c1','#7ee8d2','#5bc0ff','#a9b4c8','#7c8da6','#ffb547','#edeff3'];
const EMOJI=['💻','📚','💪','💧','🪥','🧘','🏃','🍎','😴','💰','📈','✍️','🎯','🧠','🚶','🥗','💊','🎸','🧹','📵','☀️','🙏','🎨','🌱'];
function seed(){const t=todayIso();const all=[0,1,2,3,4,5,6];return{v:1,habits:[
{id:uid(),n:'کار',e:'💻',c:'#a9b4c8',ty:'min',tg:360,u:'',days:[0,1,2,3,4],cr:t},
{id:uid(),n:'پس‌انداز',e:'💰',c:'#ffd23f',ty:'amt',tg:1000000,u:'تومان',days:all,cr:t},
{id:uid(),n:'مطالعه',e:'📚',c:'#1fd1c1',ty:'min',tg:30,u:'',days:all,cr:t},
{id:uid(),n:'مسواک',e:'🪥',c:'#5bc0ff',ty:'cnt',tg:2,u:'',days:all,cr:t},
{id:uid(),n:'آب خوردن',e:'💧',c:'#7ee8d2',ty:'cnt',tg:8,u:'',days:all,cr:t},
{id:uid(),n:'ورزش',e:'💪',c:'#ffb547',ty:'min',tg:60,u:'',days:[0,2,4,5],cr:t}],
logs:{},notes:{},set:{vib:true},timer:null}}
let D;
let memOnly=false;
function norm(o){o.logs=o.logs||{};o.notes=o.notes||{};o.set=Object.assign({vib:true,theme:'gold',mode:'dark',snd:true,notif:false,nudge:true,nudgeT:'21:00'},o.set||{});o.frozen=o.frozen||{};o.sub=o.sub||{};o.chal=o.chal||[];o.badges=o.badges||{};o.cel=o.cel||{};o.stats=o.stats||{timerMin:0};o.habits.forEach(h=>{if(h.rm===undefined)h.rm='';if(h.lk&&h.lk.k==='bud')delete h.lk});return o}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.habits)){norm(o);const MC={'#ffd60a':'#ffd23f','#14d1c4':'#1fd1c1','#81d8d0':'#7ee8d2','#4fb3d9':'#5bc0ff','#c7c7cc':'#a9b4c8','#8e9aa6':'#7c8da6','#ffb800':'#ffb547','#f0f0f0':'#edeff3'};o.habits.forEach(h=>{if(MC[h.c])h.c=MC[h.c]});return o}}}catch(e){memOnly=true}return norm(seed())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){if(!memOnly){memOnly=true;toast('حافظه‌ی مرورگر در دسترس نیست؛ داده‌ها بعد از بستن صفحه می‌روند.')}}}
D=load();save();
const R={tab:'home',sel:todayIso(),flt:'all',stF:null,stY:0,stM:0,sheet:null};
{const j=jp(todayIso());R.stY=j[0];R.stM=j[1];R.hy=j[0]}

const H=id=>D.habits.find(h=>h.id===id);
const val=(id,d)=>{const h=H(id);if(h&&h.lk){if(h.lk.k==='tx')return Math.min(h.tg,cnIdx().cnt[d]||0)}return(D.logs[d]&&D.logs[d][id])||0};
function setVal(id,d,v){const h0=H(id);if(isAuto(h0))return;v=Math.max(0,Math.round(v*100)/100);const old=val(id,d);if(!D.logs[d])D.logs[d]={};if(v)D.logs[d][id]=v;else delete D.logs[d][id];if(!Object.keys(D.logs[d]).length)delete D.logs[d];if(h0&&h0.lk&&h0.lk.k==='goal'&&v!==old)cnDeposit(h0.lk.gid,v-old);save();checkBadges()}
const prog=(h,d)=>Math.min(1,val(h.id,d)/h.tg);
const active=(h,d)=>h.days.includes(wd(d))&&d>=h.cr;
function dayStat(d,hid){if(D.frozen[d])return{n:0,p:0,done:false,fz:true};const hs=hid?D.habits.filter(h=>h.id===hid):D.habits;const a=hs.filter(h=>active(h,d));if(!a.length)return{n:0,p:0,done:false};let s=0,all=true;a.forEach(h=>{const p=prog(h,d);s+=p;if(p<1)all=false});return{n:a.length,p:s/a.length,done:all}}
const vib=()=>{if(D.set.vib&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}};

/* ---------- formatting ---------- */
function fmin(m){m=Math.round(m);if(m<60)return m+' دقیقه';const h=Math.floor(m/60),r=m%60;return h+' ساعت'+(r?' و '+r+' دقیقه':'')}
function cp(v){const a=Math.abs(v);const t=x=>String(Math.round(x*10)/10);if(a>=1e9)return t(v/1e9)+' میلیارد';if(a>=1e6)return t(v/1e6)+' میلیون';if(a>=1e4)return t(v/1e3)+' هزار';return nf(v)}
function valText(h,v,full){
 if(h.ty==='cnt'||h.ty==='chk')return '<span dir="ltr">'+nf(v)+'/'+nf(h.tg)+'</span>';
 if(h.ty==='min')return fmin(v)+' / '+fmin(h.tg);
 if(full)return '<span dir="ltr">'+nf(v)+' / '+nf(h.tg)+'</span>'+(h.u?' '+esc(h.u):'');return cp(v)+' / '+cp(h.tg)}
function ring(p,r){r=r||15;const C=2*Math.PI*r;return '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="'+r+'" class="rt"/><circle cx="18" cy="18" r="'+r+'" class="rp" transform="rotate(-90 18 18)" style="stroke-dasharray:'+(C*Math.min(1,p)).toFixed(2)+' '+C.toFixed(2)+'"/></svg>'}
const rg=(st,txt,extra)=>'<span class="rg'+(st.n&&st.p>=1?' full':'')+(st.n?'':' none')+(st.n&&st.p<=0?' z':'')+(extra||'')+'">'+ring(st.n?st.p:0)+'<b>'+txt+'</b></span>';
function rowHTML(h,v,interactive,sk){
 const p=Math.min(1,v/h.tg);
 const inner=(btn)=>'<span class="ri">'+h.e+'</span><span class="rn">'+esc(h.n)+(sk>=2?' <em class="sk" dir="ltr">🔥'+sk+'</em>':'')+(h.lk?' <i class="lkm">🔗</i>':'')+'</span><span class="rv num">'+(p>=1?'✓ ':'')+valText(h,v)+'</span>'+(btn?'<b class="mb" data-more="'+h.id+'" aria-label="جزئیات">⋯</b>':'<i class="mb">⋯</i>');
 return '<div class="row'+(p>=1?' done':'')+'" '+(interactive?'data-row="'+h.id+'" ':'')+'style="--c:'+h.c+';background:'+hexA(h.c,.16)+'"><div class="fill" style="width:'+(p*100).toFixed(1)+'%"><div class="rc dk" aria-hidden="true">'+inner(false)+'</div></div><div class="rc lt">'+inner(interactive)+'</div></div>'}

/* ---------- toast / sheet ---------- */
let tt;
let askFn=null;
function askSheet(title,msg,okText,fn){R.sheet={t:'ask'};askFn=fn;openSheet('<div class="sh"><span class="e">⚠️</span><div><b>'+title+'</b></div></div><p style="color:var(--g);font-size:14px;line-height:2;margin:4px 2px 18px">'+msg+'</p><div class="two"><button class="btn r blk" data-askok="1">'+okText+'</button><button class="btn g blk" data-askno="1">انصراف</button></div>')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function openSheet(html){$('#sb').innerHTML=html;$('#bg').classList.add('on');$('#sheet').scrollTop=0}
function closeSheet(){$('#bg').classList.remove('on');R.sheet=null;$('#sb').innerHTML=''}

/* ---------- views ---------- */
const ICONS={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
stats:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',
habits:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17"/>',
notes:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6"/>',
set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const TABS=[['home','امروز'],['stats','آمار'],['habits','عادت‌ها'],['notes','یادداشت'],['set','تنظیمات']];
function renderNav(){$('#nav').innerHTML=TABS.map(t=>'<button data-nav="'+t[0]+'" class="'+(R.tab===t[0]?'on':'')+'" aria-label="'+t[1]+'"><svg viewBox="0 0 24 24">'+ICONS[t[0]]+'</svg><span>'+t[1]+'</span></button>').join('');
 $('#fab').classList.toggle('on',R.tab==='habits')}

function vHome(){
 const T=todayIso(),sel=R.sel,ws=addDays(sel,-wd(sel));
 const title=sel===T?'امروز':sel===addDays(T,-1)?'دیروز':sel===addDays(T,1)?'فردا':WD[wd(sel)];
 const j=jp(sel);
 let strip='';
 for(let i=0;i<7;i++){const d=addDays(ws,i),st=dayStat(d);
  strip+='<button class="wd'+(d===sel?' sel':'')+(d===T?' today':'')+(d>T?' fut':'')+'" data-d="'+d+'"><span class="wl">'+WS[i]+'</span>'+rg(st,st.fz?'❄':jp(d)[2])+'</button>'}
 const all=D.habits.filter(h=>active(h,sel));
 const doneN=all.filter(h=>prog(h,sel)>=1).length;
 const avg=all.length?all.reduce((s,h)=>s+prog(h,sel),0)/all.length:0;
 let list=all.filter(h=>R.flt==='all'||(R.flt==='todo'?prog(h,sel)<1:prog(h,sel)>=1));
 list=list.filter(h=>prog(h,sel)<1).concat(list.filter(h=>prog(h,sel)>=1));
 const sks={};list.forEach(h=>{sks[h.id]=streaks(h.id).cur});
 let body;
 if(!D.habits.length)body='<div class="empty"><span class="em">🌱</span>هنوز عادتی نساخته‌ای.<br><button class="btn" data-add="1" style="margin-top:12px">ساخت اولین عادت</button></div>';
 else if(!all.length)body='<div class="empty"><span class="em">🌙</span>برای این روز عادتی برنامه‌ریزی نشده.</div>';
 else if(!list.length)body='<div class="empty"><span class="em">'+(R.flt==='todo'?'🎉':'🔍')+'</span>'+(R.flt==='todo'?'همه‌ی عادت‌های این روز کامل شد!':'هنوز هیچ‌کدام کامل نشده.')+'</div>';
 else body=list.map(h=>rowHTML(h,val(h.id,sel),true,sks[h.id])).join('');
 const fl={all:'همه',todo:'ناتمام',done:'کامل‌شده'}[R.flt];
 let tb='';
 if(D.timer){const h=H(D.timer.id);if(h)tb='<div class="tb"><span>⏱ '+esc(h.n)+' · <b class="num" id="tbt">'+clock(Date.now()-D.timer.start)+'</b></span><button data-more="'+h.id+'">باز کردن</button><button data-focus="'+h.id+'">تمرکز</button></div>'}
 const wj1=jp(ws),wj2=jp(addDays(ws,6));
 const fzLeft=fzRemain(sel);
 const mc=missed().reduce((a,x)=>a+x.hs.length,0);const cuRow=mc?'<button class="cu" data-cu0="1">🕘 جبران روزهای گذشته <b class="num">('+mc+')</b></button>':'';
 const fzRow=sel>T?'':(D.frozen[sel]?'<div class="fz on"><span>❄ این روز فریز شده و رکوردت حفظ می‌شود</span><button data-fz="1">لغو</button></div>':(all.length&&doneN<all.length?'<div class="fz"><span>❄ نمی‌رسی؟ این روز را فریز کن <b class="num">('+fzLeft+' بار باقی‌مانده این ماه)</b></span><button data-fz="1">فریز</button></div>':''));
 const nudge=(sel===T&&D.set.nudge&&all.length&&doneN<all.length&&hm(new Date())>=D.set.nudgeT&&!D.frozen[sel])?'<div class="tb nd"><span>🌙 هنوز <b class="num">'+(all.length-doneN)+'</b> عادت امروز مانده</span></div>':'';
 return '<div class="hd"><button class="tdbtn num" data-today="1" aria-label="برو به امروز">'+jp(T)[2]+'</button><div class="ttl"><h1>'+title+'</h1><small>'+WD[wd(sel)]+' '+j[2]+' '+JM[j[1]-1]+' '+j[0]+' · ⭐ سطح '+(D.stats.lv||1)+'</small></div><button class="pill" data-flt="1">'+fl+' ▾</button></div>'
 +'<div class="wk"><button data-wk="-1" aria-label="هفته قبل">›</button><span class="num">'+wj1[2]+' '+JM[wj1[1]-1]+' تا '+wj2[2]+' '+JM[wj2[1]-1]+'</span><button data-wk="1" aria-label="هفته بعد">‹</button></div>'
 +'<div class="strip" id="strip">'+strip+'</div>'
 +'<div class="sum"><div class="l"><span>'+(all.length?'<b class="num">'+doneN+'</b> از <b class="num">'+all.length+'</b> عادت کامل شد':'—')+'</span><b class="num">'+Math.round(avg*100)+'%'+'</b></div><div class="bar"><i style="width:'+(avg*100).toFixed(1)+'%"></i></div></div>'
 +cnBanner()+nudge+tb+'<div>'+body+'</div>'+cuRow+fzRow}

function clock(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}

/* stats */
function monthDays(y,m){const a=[],L=jmLen(y,m);for(let d=1;d<=L;d++)a.push(fromJ(y,m,d));return a}
function rate(hid,days){const T=todayIso();let s=0,c=0;days.forEach(d=>{if(d>T)return;const st=dayStat(d,hid);if(st.n){s+=st.p;c++}});return c?s/c:0}
function streaks(hid){const T=todayIso();let start=T;D.habits.forEach(h=>{if(h.cr<start)start=h.cr});const lim=addDays(T,-1200);if(start<lim)start=lim;let d=start,best=0,cur=0,total=0;
 while(d<=T){const st=dayStat(d,hid);if(st.n){if(st.done){cur++;total++;if(cur>best)best=cur}else if(d!==T)cur=0}d=addDays(d,1)}return{best:best,cur:cur,total:total}}

 WS.forEach(w=>cells+='<span class="h">'+w+'</span>');

 let wb='';
 for(let i=6;i>=0;i--){const d=addDays(T,-i),st=dayStat(d,f);wb+='<div><i class="'+(st.n?(st.p>=1?'f':''):'z')+'" style="height:'+Math.max(4,st.p*100)+'%"></i><span class="num">'+jp(d)[2]+'</span></div>'}

 if(!f&&D.habits.length)brk='<div class="card"><h3>عملکرد این ماه به تفکیک عادت</h3>'+D.habits.map(h=>{const p=rate(h.id,days);return '<div class="hb"><span class="e">'+h.e+'</span><div class="m"><div><span>'+esc(h.n)+'</span><b class="num">'+Math.round(p*100)+'%</b></div><div class="bar"><i style="width:'+(p*100)+'%;background:'+h.c+'"></i></div></div></div>'}).join('')+'</div>';
 const hh=f?H(f):null;
 const w7=[],p7=[];for(let i=0;i<7;i++){w7.push(addDays(T,-i));p7.push(addDays(T,-7-i))}
 const r7=rate(f,w7),rp=rate(f,p7),dl=Math.round((r7-rp)*100);
 let wn='';
 if(!f&&D.habits.length>1){const rs=D.habits.map(h=>({h:h,r:rate(h.id,w7)})).sort((a,b)=>b.r-a.r);const b=rs[0],w=rs[rs.length-1];wn='<div class="wnote">💪 قوی‌ترین: '+b.h.e+' '+esc(b.h.n)+' <b class="num">('+Math.round(b.r*100)+'%)</b><br>🌧 نیازمند توجه: '+w.h.e+' '+esc(w.h.n)+' <b class="num">('+Math.round(w.r*100)+'%)</b></div>'}
 const weekly='<div class="card"><h3>هفته‌ی من</h3><div class="wsum"><b class="num">'+Math.round(r7*100)+'%</b><span class="'+(dl>=0?'up':'dn')+' num">'+(dl>=0?'▲ ':'▼ ')+Math.abs(dl)+'% نسبت به هفته‌ی قبل</span></div>'+wn+'</div>';
 return '<div class="hd"><div class="ttl"><h1>'+(hh?hh.e+' '+esc(hh.n):'آمار کلی')+'</h1><small>پیشرفتت را در طول زمان ببین</small></div></div>'
 +'<div class="chips">'+chips+'</div>'
 +'<div class="card"><div class="mnav"><button data-mn="-1" aria-label="ماه قبل">›</button><b class="num">'+JM[R.stM-1]+' '+R.stY+'</b><button data-mn="1" aria-label="ماه بعد">‹</button></div><div class="cal">'+cells+'</div><button class="btn g blk" data-rep="1" style="margin-top:14px">📋 کارنامه‌ی '+JM[R.stM-1]+'</button></div>'
 +'<div class="card"><div class="rate"><span class="rg'+(r>=1?' full':'')+'">'+ring(r,16)+'<b class="num">'+(Math.round(r*1000)/10)+'%<small>نرخ ماهانه</small></b></span>'
 +'<div class="stats"><div class="stat"><span class="ic">🏆</span><b class="num">'+sk.best+'<small>روز</small></b><span>بهترین رکورد پیاپی</span></div>'
 +'<div class="stat"><span class="ic">🔥</span><b class="num">'+sk.cur+'<small>روز</small></b><span>رکورد فعلی</span></div>'
 +'<div class="stat"><span class="ic">✅</span><b class="num">'+perfect+'<small>روز</small></b><span>روز کامل در این ماه</span></div>'

function niceStep(t){const x=t/10;const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1))));const m=x/p;return Math.max(1,(m<1.5?1:m<3.5?2:m<7.5?5:10)*p)}

 const h=H(id);if(!h){closeSheet();return}
 R.sheet={t:'log',id:id};
 if(isAuto(h)){autoSheet(h);return}
 if(h.ty==='chk'){chkSheet(h);return}
 const d=R.sel,v=val(id,d);
 let q;
 if(h.ty==='cnt')q=[-1,1,2,5];else if(h.ty==='min')q=[-5,5,10,15,30,60];else{const s=niceStep(h.tg);q=[-s,s,2*s,5*s,10*s]}
 const unit=h.ty==='min'?'دقیقه':h.ty==='amt'?(h.u||'مقدار'):'تعداد';
 let timer='';
 if(h.ty==='min'){
  if(D.timer&&D.timer.id===id)timer='<div class="tm num" id="tmv">'+clock(Date.now()-D.timer.start)+'</div><button class="btn t blk" data-tstop="1">■ توقف و ثبت زمان</button>';
  else if(D.timer)timer='<p style="text-align:center;color:var(--mu);font-size:13px;margin:6px 0">تایمر یک عادت دیگر در حال اجراست.</p>';
  else timer='<button class="btn t blk" data-tstart="'+id+'">▶ شروع تایمر</button>'}
 if(h.ty==='min'&&(!D.timer||D.timer.id===id))timer+='<button class="btn g blk" data-focus="'+id+'" style="margin-top:8px">🎯 حالت تمرکز</button>';
 openSheet('<div class="sh"><span class="e">'+h.e+'</span><div><b>'+esc(h.n)+'</b><span class="num">'+WD[wd(d)]+' '+jl(d)+'</span></div></div>'
 +'<div class="big">'+rowHTML(h,v,false)+'</div>'+(h.ty==='amt'?'<p class="num" style="text-align:center;color:var(--mu);font-size:13px;margin-top:10px">'+valText(h,v,true)+'</p>':'')
 +'<div class="qs">'+q.map(x=>'<button class="'+(x>0?'p':'m')+' num" data-dl="'+x+'">'+(x>0?'+':'−')+nf(Math.abs(x))+'</button>').join('')+'</div>'
 +timer

 +'<div class="two"><button class="btn g" data-edit="'+id+'">✎ ویرایش عادت</button><button class="btn r" data-zero="'+id+'">↺ صفر کردن</button></div>')}

function heatCard(f){const y=R.hy,T=todayIso();let days=[];for(let m=1;m<=12;m++)days=days.concat(monthDays(y,m));
 const first=wd(days[0]);const cols=[];let col=[];for(let i=0;i<first;i++)col.push(null);
 days.forEach(d=>{col.push(d);if(col.length===7){cols.push(col);col=[]}});if(col.length){while(col.length<7)col.push(null);cols.push(col)}
 let full=0;

   return '<button class="hc '+k+(d===T?' td':'')+'" data-go="'+d+'" aria-label="'+jl(d)+'"></button>'}).join('')+'</div>'}).join('');

/* ---------- monthly report ---------- */
function grade(r){return r>=.9?['عالی','🏆']:r>=.75?['خیلی خوب','🌟']:r>=.5?['خوب','👍']:r>=.25?['در مسیر','🌱']:['شروع دوباره','💪']}
function reportData(y,m){const days=monthDays(y,m),T=todayIso(),pm=m===1?[y-1,12]:[y,m-1];
 const r=rate(null,days),rp=rate(null,monthDays(pm[0],pm[1]));let perfect=0,comp=0;
 days.forEach(d=>{if(d>T)return;const s=dayStat(d,null);if(s.n&&s.done)perfect++;if(!s.fz)D.habits.forEach(h=>{if(active(h,d)&&prog(h,d)>=1)comp++})});
 const hs=D.habits.map(h=>({h:h,r:rate(h.id,days)})).filter(x=>days.some(d=>d<=T&&active(x.h,d)&&!D.frozen[d])).sort((a,b)=>b.r-a.r);
 const wk=[];let cur=[];days.forEach(d=>{if(wd(d)===0&&cur.length){wk.push(cur);cur=[]}cur.push(d)});if(cur.length)wk.push(cur);
 const wr=wk.map((w,i)=>({i:i+1,r:rate(null,w),has:w.some(d=>d<=T&&dayStat(d,null).n)})).filter(x=>x.has).sort((a,b)=>b.r-a.r);
 return{r:r,rp:rp,perfect:perfect,comp:comp,hs:hs,bw:wr[0]}}
function reportSheet(y,m){R.sheet={t:'rep'};const d=reportData(y,m),g=grade(d.r),dl=Math.round((d.r-d.rp)*100);
 openSheet('<div class="sh"><span class="e">'+g[1]+'</span><div><b>کارنامه‌ی '+JM[m-1]+' '+y+'</b><span>'+g[0]+'</span></div></div>'
 +'<div class="rate" style="margin-bottom:14px"><span class="rg'+(d.r>=1?' full':'')+(d.r<=0?' z':'')+'">'+ring(d.r,16)+'<b class="num">'+Math.round(d.r*100)+'%<small>میانگین ماه</small></b></span><span class="num" style="color:'+(dl>=0?'var(--t)':'#ff8a80')+'">'+(dl>=0?'▲ ':'▼ ')+Math.abs(dl)+'% نسبت به ماه قبل</span></div>'
 +'<div class="stats"><div class="stat"><span class="ic">✅</span><b class="num">'+d.perfect+'<small>روز</small></b><span>روز کامل</span></div><div class="stat"><span class="ic">🎯</span><b class="num">'+d.comp+'</b><span>تکمیل عادت</span></div>'
 +'<div class="stat"><span class="ic">💪</span><b style="font-size:16px">'+(d.hs[0]?d.hs[0].h.e+' '+esc(d.hs[0].h.n):'—')+'</b><span>بهترین عادت</span></div><div class="stat"><span class="ic">📅</span><b class="num" style="font-size:18px">'+(d.bw?'هفته‌ی '+d.bw.i:'—')+'</b><span>بهترین هفته</span></div></div>'
 +'<div class="lbl">به تفکیک عادت</div>'+d.hs.map(x=>'<div class="hb"><span class="e">'+x.h.e+'</span><div class="m"><div><span>'+esc(x.h.n)+'</span><b class="num">'+Math.round(x.r*100)+'%</b></div><div class="bar"><i style="width:'+(x.r*100).toFixed(1)+'%;background:'+x.h.c+'"></i></div></div></div>').join('')
 +'<button class="btn blk" data-rimg="1" style="margin-top:14px">🖼 ذخیره به‌صورت تصویر</button>')}
function dlFile(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function drawReport(y,m){const d=reportData(y,m),g=grade(d.r),th=THEMES[D.set.theme]||THEMES.gold;const W=1080,HH=1500,c=document.createElement('canvas');c.width=W;c.height=HH;const x=c.getContext('2d');
 const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
 const bg=x.createLinearGradient(0,0,0,HH);bg.addColorStop(0,'#10212a');bg.addColorStop(1,'#050607');x.fillStyle=bg;x.fillRect(0,0,W,HH);
 const F='system-ui,Tahoma,"Segoe UI",sans-serif';x.direction='rtl';
 x.textAlign='right';x.fillStyle=th.y;x.font='800 66px '+F;x.fillText('کارنامه‌ی '+JM[m-1]+' '+y,W-80,150);
 x.fillStyle='#a9b4c8';x.font='600 38px '+F;x.fillText(g[0]+' '+g[1],W-80,215);
 const cx=W/2,cy=520,r=190;x.lineWidth=36;x.lineCap='round';x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
 if(d.r>0){x.strokeStyle=d.r>=1?th.y:th.t;x.beginPath();x.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,d.r));x.stroke()}
 x.textAlign='center';x.fillStyle='#fff';x.font='800 120px '+F;x.fillText(Math.round(d.r*100)+'%',cx,cy+30);x.fillStyle='#a9b4c8';x.font='600 34px '+F;x.fillText('میانگین ماه',cx,cy+85);
 const dl=Math.round((d.r-d.rp)*100);x.fillStyle=dl>=0?th.t:'#ff8a80';x.font='700 36px '+F;x.fillText((dl>=0?'▲ ':'▼ ')+Math.abs(dl)+'% نسبت به ماه قبل',cx,790);
 const items=[['روز کامل',String(d.perfect)],['تکمیل عادت',String(d.comp)],['بهترین هفته',d.bw?'هفته‌ی '+d.bw.i:'—']],bw=290,gap=25;
 items.forEach((it,i)=>{const right=W-80-i*(bw+gap),left=right-bw;x.fillStyle='rgba(255,255,255,.07)';rr(left,850,bw,150,28);x.fill();x.fillStyle='#fff';x.font='800 52px '+F;x.textAlign='center';x.fillText(it[1],left+bw/2,925);x.fillStyle='#a9b4c8';x.font='600 28px '+F;x.fillText(it[0],left+bw/2,972)});
 d.hs.slice(0,6).forEach((it,i)=>{const y0=1070+i*62;x.textAlign='right';x.fillStyle='#fff';x.font='700 32px '+F;x.fillText(it.h.e+' '+it.h.n,W-80,y0);x.textAlign='left';x.fillStyle='#a9b4c8';x.fillText(Math.round(it.r*100)+'%',80,y0);
  x.fillStyle='rgba(255,255,255,.1)';rr(80,y0+12,W-160,12,6);x.fill();if(it.r>0){x.fillStyle=it.h.c;const w=Math.max(12,(W-160)*Math.min(1,it.r));rr(W-80-w,y0+12,w,12,6);x.fill()}});
 x.textAlign='center';x.fillStyle='#667085';x.font='600 26px '+F;x.fillText('ساخته‌شده با برنامه‌ی عادت‌ها',W/2,HH-50);
 c.toBlob(b=>{if(b){dlFile('report-'+y+'-'+pad(m)+'.png',b,'image/png');toast('تصویر کارنامه ذخیره شد')}else toast('ساخت تصویر ممکن نشد')})}
/* ---------- csv ---------- */
function csvQ(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function exportCsv(){const r=['تاریخ شمسی,تاریخ میلادی,عادت,مقدار,هدف,درصد'];Object.keys(D.logs).sort().forEach(d=>{const j=jp(d);Object.keys(D.logs[d]).forEach(id=>{const h=H(id);if(!h)return;const v=D.logs[d][id];r.push([j[0]+'/'+pad(j[1])+'/'+pad(j[2]),d,csvQ(h.n),v,h.tg,Math.round(Math.min(1,v/h.tg)*100)].join(','))})});dlFile('habits-'+todayIso()+'.csv','\uFEFF'+r.join('\n'),'text/csv;charset=utf-8');toast('فایل CSV ذخیره شد')}
function parseCsvLine(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
function importCsv(file){const rd=new FileReader();rd.onload=()=>{const lines=String(rd.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);let ok=0,skip=0;R.noChk=true;
 lines.slice(1).forEach(l=>{const c=parseCsvLine(l),d=(c[1]||'').trim(),h=D.habits.find(x=>x.n===(c[2]||'').trim()),v=num(c[3]);if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&h&&v>=0){setVal(h.id,d,v);ok++}else skip++});
 R.noChk=false;checkBadges(true);render();toast('وارد شد: '+ok+' ردیف'+(skip?' ('+skip+' ردیف نامعتبر یا بدون عادتِ هم‌نام)':''))};rd.readAsText(file)}

/* ---------- CANdo link (works inside the combined app) ---------- */
const IN=window.parent!==window;
const CNKEY={tx:'dakhl-kharj-v1',goal:'dakhl-sgoal-v1',ins:'dakhl-inst-v1',dbt:'dakhl-debt-v1'};
function cnGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
let CN=null;
function cnIdx(){if(CN)return CN;const items=cnGet(CNKEY.tx,[]),cnt={};
 items.forEach(x=>{if(x&&x.d)cnt[x.d]=(cnt[x.d]||0)+1});
 CN={cnt:cnt};return CN}
const isAuto=h=>!!(h&&h.lk&&h.lk.k==='tx');
function cnDeposit(gid,delta){if(!delta)return;const goals=cnGet(CNKEY.goal,[]),g=goals.find(x=>String(x.id)===String(gid));if(!g)return;
 g.s=Math.max(0,(+g.s||0)+delta);try{localStorage.setItem(CNKEY.goal,JSON.stringify(goals))}catch(e){return}
 try{parent.postMessage({t:'cn-changed'},'*')}catch(e){}
 setTimeout(()=>toast((delta>0?'➕ ':'➖ ')+nf(Math.abs(delta))+' تومان '+(delta>0?'به':'از')+' هدف «'+g.n+'»'),700)}
function goCN(){try{parent.postMessage({t:'cn-go',to:'cando'},'*')}catch(e){}}
function dLab(d){return d<0?nf(-d)+' روز گذشته':d===0?'امروز':d===1?'فردا':nf(d)+' روز دیگر'}
function cnBanner(){
 if(!IN||R.tab!=='home'||R.sel!==todayIso())return '';
 const T=todayIso(),rows=[];
 cnGet(CNKEY.ins,[]).forEach(x=>{if(!x||!(x.a>0)||!x.nd||!x.day)return;if(x.total>0&&x.paid>=x.total)return;const y=Math.floor(x.nd/100),m=x.nd%100,iso=fromJ(y,m,Math.min(x.day,jmLen(y,m))),d=Math.round((fromIso(iso)-fromIso(T))/864e5);if(d<=3)rows.push({d:d,t:'قسط «'+x.n+'»',a:x.a})});
 cnGet(CNKEY.dbt,[]).forEach(x=>{if(!x||x.done||!x.due)return;const d=Math.round((fromIso(x.due)-fromIso(T))/864e5);if(d<=3)rows.push({d:d,t:(x.dir==='lend'?'طلب از ':'بدهی به ')+x.w,a:x.a})});
 rows.sort((a,b)=>a.d-b.d);
 const line='';
 if(!rows.length)return '';
 return '<button class="cnb" data-opencn="1"><span class="ci">💰</span><div class="cm">'+rows.slice(0,3).map(r=>'<div class="cl'+(r.d<0?' neg':'')+' num">⏰ '+dLab(r.d)+' · '+r.t+' · '+nf(r.a)+'</div>').join('')+'</div><span class="ar">‹</span></button>'}
window.addEventListener('storage',e=>{CN=null;if(e.key&&e.key.indexOf('dakhl-')===0)render()});
window.addEventListener('message',e=>{const m=e.data;if(m&&m.t==='cn-refresh'){CN=null;render()}});
function autoSheet(h){R.sheet={t:'auto'};const T=R.sel;
 const note='هر تراکنشی که در کندو ثبت کنی، برای همان روز شمرده می‌شود. هدف: '+nf(h.tg)+' تراکنش در روز.';
 openSheet('<div class="sh"><span class="e">'+h.e+'</span><div><b>'+esc(h.n)+'</b><span>این عادت خودکار از کندو پر می‌شود</span></div></div><div class="big">'+rowHTML(h,val(h.id,T),false)+'</div><p style="color:var(--g);font-size:13.5px;line-height:2;margin:14px 2px">'+note+'</p><div class="two"><button class="btn t" data-opencn="1">باز کردن کندو</button><button class="btn g" data-edit="'+h.id+'">✎ ویرایش</button></div>')}

applyTheme();checkBadges(true);render();setTimeout(tick,1500);

window.__app={D:()=>D,R:R,render:render};
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
